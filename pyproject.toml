[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redact-proxy"
version = "0.1.0"
description = "Local PII/secret-redacting proxy for LLM APIs. Two layers: a gitleaks-derived regex floor plus the MLX 8-bit OpenAI Privacy Filter. Scrubs outbound requests before they leave your machine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "openmed[mlx]",
  "huggingface_hub",
  "fastapi",
  "uvicorn",
  "httpx",
]

[project.scripts]
llm-redact-proxy = "redact_proxy.server:main"

[tool.setuptools.packages.find]
include = ["redact_proxy*"]
