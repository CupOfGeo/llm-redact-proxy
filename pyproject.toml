[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-redact-proxy"
version = "0.4.1"
description = "Local PII/secret-redacting proxy for LLM APIs. Two layers: a gitleaks-derived regex floor plus the MLX 8-bit OpenAI Privacy Filter. Scrubs outbound requests before they leave your machine."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "openmed[mlx]",
  "huggingface_hub",
  "fastapi",
  "uvicorn",
  "httpx",
  "click",
  "structlog",
  "truststore",
]

[project.scripts]
redact-proxy = "redact_proxy.cli:main"
llm-redact-proxy = "redact_proxy.cli:main"

[tool.setuptools.packages.find]
include = ["redact_proxy*"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pre-commit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff.lint]
extend-select = ["E402"]
